# Hosted support lookup (task fd71c74c, README.md). The login can only run the
# lookup. authorized_keys repeats this with from="<office box address>",restrict,command="...".
Match User hostedsupport
	AuthenticationMethods publickey
	ForceCommand /usr/local/sbin/hosted-support-ssh
	PermitTTY no
	DisableForwarding yes
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
