# No RBAC is bound to this account, and pods do not mount its token: agents
# run arbitrary commands and must not reach the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isomux
  namespace: isomux
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isomux-seccomp-installer
  namespace: isomux-node-setup
automountServiceAccountToken: false
