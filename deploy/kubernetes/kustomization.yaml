apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Reference base for an Isomux office on EKS. Use it from an overlay that sets
# the office host, certificate and image digest:
# https://isomux.com/docs/hosting-kubernetes
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - storageclass.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # Remove if node user data installs the seccomp profile instead.
  - seccomp-installer.yaml
configMapGenerator:
  - name: isomux-config
    namespace: isomux
    literals:
      - ISOMUX_PUBLIC_URL=https://office.example.com
  - name: isomux-seccomp
    namespace: isomux-node-setup
    files:
      - seccomp/isomux-chromium-v1.json
images:
  - name: ghcr.io/nmamano/isomux
    digest: sha256:REPLACE_WITH_IMAGE_DIGEST
