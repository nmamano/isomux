<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isomux Browser</title>
    <link rel="stylesheet" href="connection.css" />
    <script type="module" src="connection.js"></script>
  </head>
  <body>
    <main>
      <h1>Isomux Browser</h1>
      <p id="status" role="status"></p>
      <p id="member"></p>
      <p id="office-display"></p>
      <form id="pair-form">
        <label id="office-label" for="office"></label>
        <input
          id="office"
          type="url"
          required
          placeholder="https://office.example.com"
          autocomplete="url"
        />
        <label id="code-label" for="code"></label>
        <input id="code" required autocomplete="off" spellcheck="false" />
        <button id="pair" type="submit"></button>
      </form>
      <div id="controls">
        <button id="replace"></button>
        <button id="reconnect"></button>
        <button id="disconnect"></button>
        <button id="unpair"></button>
      </div>
      <p id="offline-help"></p>
      <section id="tab-control">
        <label id="agent-label" for="agent"></label>
        <select id="agent" disabled></select>
        <label id="expiry-label" for="expiry"></label>
        <select id="expiry" disabled>
          <option id="expiry-never" value="0" selected></option>
          <option id="expiry-15" value="15"></option>
          <option id="expiry-60" value="60"></option>
          <option id="expiry-240" value="240"></option>
        </select>
        <label><input type="checkbox" id="allow" role="switch" disabled /><span id="allow-label"></span></label>
        <p id="tab-state" role="status"></p>
        <p id="expiry-state"></p>
      </section>
      <p id="retained"></p>
      <p id="error" role="alert"></p>
    </main>
  </body>
</html>
