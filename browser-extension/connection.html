<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Isomux Browser</title>
    <link rel="stylesheet" href="connection.css" />
    <script type="module" src="connection.js"></script>
  </head>
  <body>
    <main>
      <h1>Isomux Browser</h1>
      <button id="unmute-tab" type="button" hidden></button>
      <section id="office-control" aria-labelledby="office-heading">
        <h2 id="office-heading"></h2>
        <select
          id="office-picker"
          aria-labelledby="office-heading"
          hidden
        ></select>
        <p id="status" role="status"></p>
        <p id="member"></p>
        <p id="office-display"></p>
        <form id="pair-form">
          <label id="office-label" for="office"></label>
          <input
            id="office"
            type="url"
            required
            placeholder="https://office.example.com"
            autocomplete="url"
          />
          <label id="code-label" for="code"></label>
          <div class="code-entry">
            <input
              id="code"
              type="password"
              required
              autocomplete="off"
              spellcheck="false"
            />
            <button
              id="code-visibility"
              type="button"
              aria-controls="code"
              aria-describedby="code-label"
              aria-pressed="false"
            ></button>
          </div>
          <button id="pair" type="submit"></button>
        </form>
        <div id="controls">
          <button id="replace"></button>
          <button id="reconnect"></button>
          <button id="disconnect"></button>
          <button id="unpair"></button>
        </div>
        <p id="offline-help"></p>
        <p id="store-install" hidden>
          <a id="store-link" target="_blank" rel="noopener"></a>
          <span id="store-steps"></span>
        </p>
        <div id="update" role="status" hidden>
          <p id="update-store" hidden></p>
          <div id="update-office">
            <p id="update-ready"></p>
            <p>
              <a id="update-download" target="_blank" rel="noopener"></a>
            </p>
            <p id="update-steps"></p>
          </div>
          <div id="update-files" hidden>
            <p id="update-files-ready"></p>
            <button id="update-reload" type="button"></button>
            <p id="update-reload-note"></p>
          </div>
        </div>
      </section>
      <section id="share-section" hidden>
        <label id="share-label" for="share-agent"></label>
        <select id="share-agent"></select>
        <button id="share" type="button" disabled></button>
        <p id="share-status" role="status"></p>
      </section>
      <section id="tab-control">
        <label id="agents-label" for="agents"></label>
        <select id="agents" disabled>
          <option id="agents-mine" value="mine"></option>
          <option id="agents-members" value="members"></option>
          <option id="agents-office" value="office"></option>
        </select>
        <div id="members" role="group" aria-labelledby="agents-members" hidden>
          <ul id="members-list"></ul>
          <p id="members-none"></p>
        </div>
        <label class="control-switch"
          ><span id="allow-label"></span
          ><input type="checkbox" id="allow" role="switch" disabled /><span
            class="switch-track"
            aria-hidden="true"
          ></span
        ></label>
        <p id="tab-state" role="status"></p>
        <div id="agent-tabs" hidden>
          <label class="control-switch"
            ><span id="open-tabs-label"></span
            ><input type="checkbox" id="open-tabs" role="switch" /><span
              class="switch-track"
              aria-hidden="true"
            ></span
          ></label>
          <ul id="agent-tabs-list"></ul>
        </div>
      </section>
      <p id="retained"></p>
      <p id="error" role="alert"></p>
    </main>
  </body>
</html>
