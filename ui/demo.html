<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Isomux Demo - Interactive Demo</title>
    <meta
      name="description"
      content="Try Isomux live. Give your agents a cute office: multi-device, multi-user, multi-agent collaboration."
    />
    <link rel="canonical" href="https://isomux.com/demo" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://isomux.com/demo" />
    <meta property="og:title" content="Isomux Demo - Interactive Demo" />
    <meta
      property="og:description"
      content="Try Isomux live. Give your agents a cute office: multi-device, multi-user, multi-agent collaboration."
    />
    <meta property="og:image" content="https://isomux.com/screenshot.png" />
    <meta property="og:site_name" content="Isomux" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://isomux.com/demo" />
    <meta name="twitter:title" content="Isomux Demo - Interactive Demo" />
    <meta
      name="twitter:description"
      content="Try Isomux live. Give your agents a cute office: multi-device, multi-user, multi-agent collaboration."
    />
    <meta name="twitter:image" content="https://isomux.com/screenshot.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0d1117" />

    <link rel="stylesheet" href="/demo/xterm.css" />
    <link rel="icon" href="/favicon.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Pre-paint theme resolution so the demo iframe doesn't flash the
         wrong mode before the JS bundle and ThemeProvider mount. Mirrors
         the logic in ui/store.tsx (getInitialThemeId + ThemeProvider). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("isomux-theme");
          var theme =
            saved ||
            (window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          var lightThemes = ["light", "solarized-light"];
          var mode = lightThemes.indexOf(theme) >= 0 ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-theme-mode", mode);
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #0a0e16;
      }
      [data-theme-mode="light"] body {
        background: #f0f2f6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script defer src="/analytics.js"></script>
    <script type="module" src="/demo/demo-entry.js"></script>
  </body>
</html>
