---
name: macOS boot

# The local install guide supports macOS, and nothing else in CI runs there.
# This job boots the office on real Macs (Apple silicon and Intel) the way the
# guide does, and fails if it does not answer HTTP.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Agent turns need provider credentials, which CI does not have. Check
      # that the darwin builds of both agent CLIs installed and run.
      - name: Run the Claude and Codex CLIs
        run: |
          arch=arm64
          if [ "$(uname -m)" = "x86_64" ]; then arch=x64; fi
          "node_modules/@anthropic-ai/claude-agent-sdk-darwin-$arch/claude" --version
          bun node_modules/@openai/codex/bin/codex.js --version

      # These features call macOS programs that differ from their Linux
      # versions: bsdtar for backups, code signing for the compiled Codex
      # safety hook, the Chrome app bundle for previews, the Keychain for the
      # Claude sign-in check, and LOCAL_PEERCRED for the admin socket's caller
      # check.
      - name: Run the tests for macOS-specific behavior
        env:
          ISOMUX_TEST_MAC_KEYCHAIN: "1"
          ISOMUX_TEST_REAL_PREVIEW: "1"
        run: >-
          bun test server/backup.test.ts
          server/backends/codex/safety-hook.test.ts
          server/backends/codex/safety-hook-install.test.ts
          server/test-support/preview-capture.test.ts
          server/backends/claude-install-check.test.ts
          server/unix-socket-server.test.ts
          server/test-support/admin-socket.test.ts

      # Codex lists a hook and reports its trust without a real login.
      - name: Check that Codex trusts the installed safety hook
        run: |
          auth="$RUNNER_TEMP/codex-auth"
          mkdir -p "$auth"
          echo '{"OPENAI_API_KEY":"sk-isomux-ci-placeholder"}' > "$auth/auth.json"
          ISOMUX_TEST_LIVE=1 ISOMUX_TEST_CODEX_AUTH_HOME="$auth" bun test server/backends/codex/safety-hook-install.live.test.ts

      # OpenCode's authority broker and server supervisor use macOS system
      # calls here. The last file runs a real turn on the pinned OpenCode
      # server against a mock provider, so it needs no key.
      - name: Test OpenCode process identity, server lock and authority broker
        env:
          ISOMUX_TEST_OPENCODE: "1"
        run: >-
          bun test
          server/backends/opencode/darwin-libsystem.test.ts
          server/backends/opencode/platform.test.ts
          server/backends/opencode/supervisor.lock.test.ts
          server/backends/opencode/authority-broker.test.ts
          server/backends/opencode/authority-broker.identity.test.ts
          server/backends/opencode/authority-broker.ancestry.test.ts
          server/backends/opencode/authority-broker.opencode.test.ts

      - name: Boot the office and check that it answers HTTP
        env:
          ISOMUX_HOME: ${{ runner.temp }}/isomux-home
          PORT: "4000"
        run: |
          log="$RUNNER_TEMP/isomux-dev.log"
          bun run dev > "$log" 2>&1 &
          pid=$!
          status=000
          for _ in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "The office exited during boot."
              break
            fi
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/" || true)
            [ "$status" = "200" ] && break
            sleep 2
          done
          cat "$log"
          kill "$pid" 2>/dev/null || true
          test "$status" = "200"
