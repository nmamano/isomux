---
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The control-plane store runs on Postgres, and its suite runs against a
    # real one - the CAS losers, lease arbitration and partial-index refusals it
    # pins are engine behaviour. A service container rather than an opt-in step
    # so there is no arrangement of this file in which those tests quietly do
    # not run: without it they FAIL, they never skip.
    #
    # Matching the README's local one-liner exactly, port included, so a
    # contributor's green run and CI's green run mean the same thing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: isomux
          POSTGRES_PASSWORD: isomux
          POSTGRES_DB: control_plane_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U isomux -d control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned via package.json "packageManager" so CI tests the same
          # runtime the installer puts on customer boxes.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The root `bun test` runs the control-plane web app's tests too, and one
      # of them renders a component that imports Next. Without the web app's
      # own install that test fails on a missing module (seen on f71f21e).
      - name: Install the web app's dependencies
        run: bun install --cwd control-plane/web --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      # The "audit" stage of `bun run ci`: critical and high advisories in the
      # runtime dependencies. New advisories appear with no commit here, so it
      # warns and does not fail the build.
      - name: Audit runtime dependencies
        continue-on-error: true
        run: bun run audit:runtime

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Build UI
        run: bun run build:ui

      - name: Run tests
        run: bun scripts/test-shards.ts

      # The "opencode live" stage of `bun run ci`: real OpenCode turns from the
      # opencode-v1 package against mock providers, so it needs no key.
      - name: Run the OpenCode live tier
        timeout-minutes: 5
        run: bun run test:opencode:ci

  # The control-plane web app (`bun run ci:web`) is part of the local pre-push
  # gate (`bun run ci`), so it must be enforced here too - otherwise the hook
  # checks something GitHub never does and the two gates drift. Its own job so
  # it runs in parallel with the main build.
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Root install too: lint:web runs the repo-root ESLint against the web
      # tree, and ci:web does the web app's own frozen install itself.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, typecheck and lint the web app
        run: bun run ci:web

  # The `container` stage of `bun run ci`: the release workflow's image build,
  # smoke and Compose checks, on its amd64 runner.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the release image
        run: bash deploy/container/check.sh HEAD
