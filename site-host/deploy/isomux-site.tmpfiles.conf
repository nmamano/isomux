# /etc/tmpfiles.d/isomux-site.conf. The directory for the site's Unix socket, which Caddy
# connects to. The directory is 0755 and server.ts creates the socket with mode 0666, so
# any local user can connect: the socket serves only what the public site serves (the
# same choice as bigOspeedrun and nilmamano.com).
# isomux-site is a dedicated system user, created once:
#   useradd --system --no-create-home --shell /usr/sbin/nologin isomux-site
# Its numeric uid and gid go in /opt/isomux-site/release.env as ISOMUX_SITE_UID and
# ISOMUX_SITE_GID.
d /run/isomux-site 0755 isomux-site isomux-site -
